<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSEL // Fabrication Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FSEL HOLOGRAPHIC HUD — DESIGN TOKENS
   ============================================================ */
:root {
  --bg:        #05090F;
  --panel:     #0A1320;
  --panel-2:   #0D1A2B;
  --line:      rgba(82, 213, 255, 0.16);
  --line-hi:   rgba(82, 213, 255, 0.45);
  --cyan:      #3FE0FF;
  --cyan-soft: rgba(63, 224, 255, 0.12);
  --amber:     #FFB454;
  --amber-soft:rgba(255, 180, 84, 0.12);
  --green:     #4DF59B;
  --green-soft:rgba(77, 245, 155, 0.10);
  --red:       #FF5C7A;
  --red-soft:  rgba(255, 92, 122, 0.10);
  --text:      #D7E9F5;
  --dim:       #6E8AA5;
  --display:   'Rajdhani', 'Segoe UI', sans-serif;
  --mono:      'Share Tech Mono', 'Courier New', monospace;
  --ease-out:  cubic-bezier(.22, 1, .36, 1);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scrollbar-color: #1A3550 var(--bg); }
body {
  background: var(--bg); color: var(--text); font-family: var(--display); min-height:100vh;
  overflow-x:hidden;
}

/* ---------- Ambient layers (subtle, GPU-cheap) ---------- */
.amb-grid {
  position:fixed; inset:-60px; z-index:-2; pointer-events:none; opacity:.5;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(63,224,255,0.08), transparent),
    linear-gradient(rgba(63,224,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(63,224,255,.025) 1px, transparent 1px);
  background-size: 100% 100%, 48px 48px, 48px 48px;
  animation: griddrift 60s linear infinite;
}
@keyframes griddrift { from { transform:translate3d(0,0,0); } to { transform:translate3d(48px,48px,0); } }
.amb-scan {
  position:fixed; left:0; right:0; height:140px; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(63,224,255,.035), transparent);
  animation: scansweep 9s var(--ease-out) infinite;
}
@keyframes scansweep { 0% { top:-20%; } 70%, 100% { top:115%; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
}

/* ---------- Entrance choreography ---------- */
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@keyframes viewfade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes growx { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes glowpulse { 0%,100% { box-shadow:0 0 6px var(--amber); } 50% { box-shadow:0 0 14px var(--amber); } }
@keyframes sheen {
  0%, 18% { transform:translateX(-110%) skewX(-18deg); }
  38%, 100% { transform:translateX(240%) skewX(-18deg); }
}
#view.vin { animation: viewfade .35s var(--ease-out) both; }
.panel, .kpi { animation: rise .5s var(--ease-out) both; animation-delay: var(--d, 0ms); }

/* ---------- HUD frame & header ---------- */
.shell { max-width:1600px; margin:0 auto; padding:18px 20px 80px; }
header.hud {
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  border:1px solid var(--line); background:linear-gradient(180deg, var(--panel-2), var(--panel));
  padding:16px 20px; position:relative; margin-bottom:14px;
  animation: rise .5s var(--ease-out) both;
}
.corners::before, .corners::after, .corners > .c::before, .corners > .c::after {
  content:''; position:absolute; width:14px; height:14px; pointer-events:none;
  transition: width .25s, height .25s;
}
.corners::before { top:-1px; left:-1px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
.corners::after  { top:-1px; right:-1px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.corners > .c::before { bottom:-1px; left:-1px; border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }
.corners > .c::after  { bottom:-1px; right:-1px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.panel:hover.corners::before, .panel:hover.corners::after,
.panel:hover.corners > .c::before, .panel:hover.corners > .c::after { width:22px; height:22px; }
.brand h1 { font-size:22px; font-weight:700; letter-spacing:3px; text-transform:uppercase; text-shadow:0 0 18px rgba(63,224,255,.25); }
.brand h1 span { color:var(--cyan); }
.brand .sub { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:2px; margin-top:2px; }
.hud-spacer { flex:1; }
.hud-meta { text-align:right; font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.7; }
.hud-meta .updated { color:var(--green); white-space:nowrap; }
.hud-meta .updated.warn { color:var(--amber); }
.hud-meta .updated::before { content:'\25CF'; margin-right:6px; font-size:8px; vertical-align:middle; animation:pulse 2s infinite; }
.hud-meta .updated #updTime { color:var(--dim); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.ring-wrap { display:flex; align-items:center; gap:12px; }
.ring { width:64px; height:64px; transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:5; }
.ring .track { stroke:rgba(63,224,255,0.12); }
.ring .arc { stroke:var(--cyan); stroke-linecap:round; transition:stroke-dashoffset 1s var(--ease-out); filter:drop-shadow(0 0 5px rgba(63,224,255,.65)); }
.ring-label { font-family:var(--mono); }
.ring-label b { font-size:20px; color:var(--cyan); }
.ring-label small { display:block; font-size:10px; color:var(--dim); letter-spacing:2px; }
button.hud-btn {
  font-family:var(--mono); font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
  background:transparent; color:var(--cyan); border:1px solid var(--line-hi);
  padding:9px 16px; cursor:pointer; transition:all .2s var(--ease-out);
}
button.hud-btn:hover { background:var(--cyan-soft); box-shadow:0 0 14px rgba(63,224,255,.3); transform:translateY(-1px); }
button.hud-btn.unlocked { color:var(--amber); border-color:rgba(255,180,84,.5); }
button.hud-btn.unlocked:hover { background:var(--amber-soft); box-shadow:0 0 14px rgba(255,180,84,.3); }
button:focus-visible, .tab:focus-visible, .chip:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

/* ---------- Tabs & phase bar ---------- */
nav.tabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.tab {
  font-family:var(--mono); font-size:12px; letter-spacing:2px; text-transform:uppercase;
  background:var(--panel); color:var(--dim); border:1px solid var(--line);
  padding:10px 16px; cursor:pointer; position:relative; transition:all .2s var(--ease-out);
}
.tab:hover { color:var(--text); transform:translateY(-1px); }
.tab.active { color:var(--cyan); border-color:var(--line-hi); background:var(--cyan-soft); }
.tab.active::after { content:''; position:absolute; left:10%; right:10%; bottom:-1px; height:2px; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
.phasebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.phasebar .plabel { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); }
.chip {
  font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
  border:1px solid var(--line); background:transparent; color:var(--dim); padding:6px 14px; cursor:pointer;
  transition:all .2s var(--ease-out);
}
.chip:hover { color:var(--text); transform:translateY(-1px); }
.chip.on { color:var(--cyan); border-color:var(--line-hi); background:var(--cyan-soft); }
.chip.ghost { border-style:dashed; }
.chip.sm { padding:4px 10px; font-size:10px; }
.mtxfilters { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:14px; }
.mf-label { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); margin:0 2px 0 10px; }
.mf-label:first-child { margin-left:0; }

/* ---------- Panels & KPIs ---------- */
.panel { border:1px solid var(--line); background:var(--panel); padding:18px; position:relative; margin-bottom:14px; }
.panel-title { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.panel-title::before { content:''; width:8px; height:8px; background:var(--cyan); clip-path:polygon(0 0,100% 50%,0 100%); }
.panel-title .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
.kpi { border:1px solid var(--line); background:var(--panel); padding:14px 16px; transition:border-color .25s, box-shadow .25s; }
.kpi:hover { border-color:var(--line-hi); box-shadow:0 0 16px rgba(63,224,255,.1); }
.kpi b { font-size:26px; font-weight:700; display:block; }
.kpi small { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
.kpi.done b { color:var(--green); } .kpi.active b { color:var(--amber); }
.kpi.pending b { color:var(--dim); } .kpi.total b { color:var(--cyan); } .kpi.alert b { color:var(--red); }

/* ---------- Pipeline strip + lens ---------- */
.pipeline { display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; }
.stage {
  flex:1; min-width:128px; position:relative; padding:12px 14px 12px 22px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--line); transition:background .2s, border-color .2s;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
  overflow:hidden;
  animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms);
}
.stage:first-child { clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-left:14px; }
.stage::after {   /* traveling energy wave: per-stage sheen offset by index */
  content:''; position:absolute; top:0; bottom:0; width:45%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(63,224,255,.10), transparent);
  animation: sheen 5.5s linear infinite; animation-delay: calc(var(--i, 0) * .45s);
}
.stage:hover { background:#11233A; }
.stage.sel { background:var(--cyan-soft); border-color:var(--line-hi); }
.stage .s-name { font-weight:700; font-size:14px; letter-spacing:1.5px; text-transform:uppercase; }
.stage .s-w { font-family:var(--mono); font-size:9px; color:var(--dim); letter-spacing:1px; }
.stage .s-pct { font-family:var(--mono); font-size:18px; margin-top:8px; }
.stage .s-bar { height:3px; background:rgba(63,224,255,.12); margin-top:8px; position:relative; overflow:hidden; }
.stage .s-fill { position:absolute; inset:0 auto 0 0; transform-origin:left; animation: growx .9s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
.stage[data-band="lo"] .s-pct { color:var(--dim); }   .stage[data-band="lo"] .s-fill { background:var(--dim); }
.stage[data-band="mid"] .s-pct { color:var(--amber); } .stage[data-band="mid"] .s-fill { background:var(--amber); box-shadow:0 0 8px var(--amber); }
.stage[data-band="hi"] .s-pct { color:var(--green); }  .stage[data-band="hi"] .s-fill { background:var(--green); box-shadow:0 0 8px var(--green); }
.lens { margin-top:12px; border:1px solid var(--line-hi); background:var(--panel-2); padding:14px 16px; animation: rise .35s var(--ease-out) both; }
.lens h3 { font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--cyan); text-transform:uppercase; margin-bottom:10px; }
.lens-cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; }
.lens-col h4 { font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:7px; }
.lens-col.done h4 { color:var(--green); } .lens-col.active h4 { color:var(--amber); } .lens-col.pending h4 { color:var(--dim); }
.lens-col div { font-size:13px; padding:3px 0; border-bottom:1px dashed var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.lens-col .none { color:var(--dim); font-family:var(--mono); font-size:11px; border:none; }

/* ---------- Matrix ---------- */
.table-scroll { overflow-x:auto; }
.xtable { width:100%; border-collapse:collapse; font-size:13px; }
.xtable th { font-family:var(--mono); font-size:10px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-hi); }
.xtable th.num, .xtable td.num { text-align:right; font-family:var(--mono); white-space:nowrap; }
.xtable td { padding:9px 10px; border-bottom:1px solid var(--line); }
.xtable tr:hover td { background:rgba(63,224,255,.04); }
.xtable td.cost { color:var(--cyan); }
.xtable tfoot td { border-top:1px solid var(--line-hi); border-bottom:none; color:var(--text); font-family:var(--mono); }
.xrow { cursor:pointer; }
.xrow:hover td { background:rgba(63,224,255,.06); }
.xrow.open td { background:rgba(63,224,255,.05); }
.xcaret { display:inline-block; width:14px; color:var(--cyan); font-size:10px; }
.xdetail td { padding:0 10px 10px 26px; background:rgba(63,224,255,.02); }
.xsub { width:100%; border-collapse:collapse; font-size:12px; }
.xsub th { font-family:var(--mono); font-size:9px; letter-spacing:1px; color:var(--dim); text-transform:uppercase; text-align:left; padding:8px 10px 6px; }
.xsub th.num, .xsub td.num { text-align:right; font-family:var(--mono); white-space:nowrap; }
.xsub td { padding:5px 10px; border-bottom:1px dashed var(--line); }
.xsub td.cost { color:var(--cyan); }
.hero-total { position:relative; border:1px solid var(--line-hi); padding:22px 28px 24px; margin-bottom:14px; overflow:hidden;
  background:
    radial-gradient(130% 180% at 0% 0%, rgba(63,224,255,.12), transparent 55%),
    radial-gradient(130% 180% at 100% 120%, rgba(77,245,155,.09), transparent 55%),
    var(--panel);
  animation: rise .5s var(--ease-out) both; }
.ht-sheen { position:absolute; top:0; bottom:0; left:-60%; width:42%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(63,224,255,.14), transparent); transform:skewX(-18deg);
  animation: heroSheen 5s ease-in-out infinite; }
@keyframes heroSheen { 0% { left:-60%; } 55%,100% { left:150%; } }
.ht-label, .ht-value { position:relative; z-index:1; }
.ht-label { font-family:var(--mono); font-size:11px; letter-spacing:5px; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
.ht-value { font-family:var(--display); font-weight:700; line-height:.95; display:inline-flex; align-items:baseline;
  background:linear-gradient(92deg, var(--cyan) 0%, #8af0ff 42%, var(--green) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 0 22px rgba(63,224,255,.42)); }
.ht-cur { font-size:32px; margin-right:5px; opacity:.85; }
.ht-int { font-size:clamp(46px, 8vw, 78px); letter-spacing:1px; }
.ht-dec { font-size:28px; opacity:.7; margin-left:2px; }
.modal.wide { max-width:640px; }
.xd-item { font-family:var(--display); font-weight:600; font-size:18px; color:var(--text); margin:-4px 0 12px; line-height:1.3; word-break:break-word; }
.xd-sum { display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; font-family:var(--mono); font-size:12px; letter-spacing:1px; color:var(--dim); padding-bottom:12px; border-bottom:1px solid var(--line); }
.xd-sum .cost { color:var(--cyan); font-size:14px; margin-left:auto; }
.xd-table { margin-top:12px; }
.xd-table td, .xd-table th { white-space:normal; }
.xd-table td.num, .xd-table th.num { white-space:nowrap; }
.xtoolbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
.btn-sm { font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; background:transparent; border:1px solid var(--line); color:var(--dim); padding:6px 12px; cursor:pointer; transition:all .2s; }
.btn-sm:hover { color:var(--cyan); border-color:var(--line-hi); transform:translateY(-1px); }
.tnote { font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.6; }
.panel-title .right.over { color:var(--red); }
.tbar { height:6px; background:rgba(63,224,255,.1); margin-bottom:14px; overflow:hidden; }
.tbar > i { display:block; height:100%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transition:width .6s var(--ease-out); }
.tbar > i.over { background:var(--red); box-shadow:0 0 8px var(--red); }
.slots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.slot { border:1px dashed var(--line); min-height:58px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-family:var(--mono); font-size:10px; letter-spacing:1px; }
.slot.filled { border-style:solid; border-color:var(--line-hi); background:rgba(63,224,255,.05); flex-direction:column; align-items:flex-start; justify-content:center; padding:8px 12px; }
.slot.filled.over { border-color:rgba(255,92,122,.6); background:var(--red-soft); }
.slot-id { font-family:var(--display); font-weight:600; font-size:13px; color:var(--text); }
.slot-sev { font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:.5px; margin-top:3px; }
.tmeta { display:flex; gap:22px; margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:1px; }
.tmeta b { color:var(--cyan); font-size:14px; }
@media (max-width:560px){ .slots { grid-template-columns:repeat(2,1fr); } }
.cd-wrap { display:flex; gap:24px; flex-wrap:wrap; }
.cd-sevlist { display:flex; flex-direction:column; gap:10px; min-width:170px; }
.cd-sev { display:flex; align-items:center; gap:11px; font-family:var(--display); font-weight:600; font-size:16px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--line); padding:14px 16px; cursor:pointer; transition:all .2s var(--ease-out); }
.cd-sev:hover { color:var(--text); }
.cd-sev.on { color:var(--text); border-color:var(--line-hi); border-left-color:var(--sc); background:rgba(63,224,255,.05); }
.cd-sev-dot { width:10px; height:10px; border-radius:50%; background:var(--sc); box-shadow:0 0 8px var(--sc); flex:0 0 auto; }
.cd-detail { display:flex; gap:20px; flex:1; flex-wrap:wrap; align-items:flex-start; }
.cd-ring { text-align:center; }
.cd-gauge { position:relative; width:130px; height:130px; margin:0 auto; }
.cd-gauge svg { width:130px; height:130px; transform:rotate(-90deg); }
.cdr-track { fill:none; stroke:rgba(63,224,255,.1); stroke-width:6; }
.cdr-arc { fill:none; stroke:var(--sc); stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 5px var(--sc)); transition:stroke-dashoffset .8s var(--ease-out); }
.cd-ring.nodata .cdr-arc { stroke:rgba(120,140,165,.25); filter:none; }
.cd-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.cd-center b { font-family:var(--display); font-size:32px; font-weight:700; color:var(--text); line-height:1; }
.cd-center small { font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; margin-top:3px; }
.cd-nodata { font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--dim); }
.cd-bar-lbl { font-family:var(--display); font-weight:700; font-size:18px; color:var(--sc); margin-top:8px; }
.cd-exp { font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:1px; margin-top:3px; }
@media (max-width:640px){ .cd-sevlist { flex-direction:row; min-width:0; width:100%; flex-wrap:wrap; } .cd-detail { justify-content:center; width:100%; } }
.sp-sub { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:1px; margin:-6px 0 8px; }
.sp-mass { color:var(--amber); }
.chart-title { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; margin:14px 0 5px; }
.chart { width:100%; height:auto; background:rgba(2,6,12,.35); border:1px solid var(--line); }
.chart .grid { stroke:rgba(63,224,255,.08); stroke-width:1; }
.chart .axlbl { fill:var(--dim); font-family:var(--mono); font-size:9px; }
.chart .tgt { stroke:rgba(255,180,84,.45); stroke-width:1; stroke-dasharray:4 3; }
.chart .tgtlbl { fill:var(--amber); font-family:var(--mono); font-size:8px; }
.chart-empty { color:var(--dim); font-family:var(--mono); font-size:11px; padding:24px; text-align:center; border:1px solid var(--line); background:rgba(2,6,12,.35); }
.rd-add { border-top:1px dashed var(--line); margin-top:14px; padding-top:14px; }
.log-panel { margin-top:8px; }
.cmp-hint { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.5px; margin-bottom:12px; }

    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);

    }
  } catch (e) { /* fall through to JS implementation */ }
  return jsSha256(str);
}

/* ----------------------------- STORAGE ADAPTER ----------------------------- */
const Store = {
  mode: 'local',            /* 'claude' | 'firebase' | 'local' */
  _ref: null,
  _lastWritten: null,       /* echo suppression for firebase listener */

  async init() {
    if (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function') {
      this.mode = 'claude';
      return;
    }
    if (FIREBASE_CONFIG.databaseURL) {
      try {
        await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');
        const fb = {};
        Object.keys(FIREBASE_CONFIG).forEach((k) => { if (FIREBASE_CONFIG[k]) fb[k] = FIREBASE_CONFIG[k]; });
        firebase.initializeApp(fb);
        this._ref = firebase.database().ref(FIREBASE_PATH);
        this.mode = 'firebase';
        return;
      } catch (e) {
        toast('FIREBASE CONNECTION FAILED — LOCAL PREVIEW MODE', 'bad');
      }
    }
    this.mode = 'local';
  },

  async load() {
    if (this.mode === 'claude') {
      try {
        const res = await window.storage.get(STORE_KEY, true);
        return res && res.value ? res.value : null;
      } catch (e) { return null; }
    }
    if (this.mode === 'firebase') {
      const snap = await this._ref.get();
      const v = snap.val();
      return typeof v === 'string' ? v : null;
    }
    return null;            /* local preview: always start from seed */
  },

  async save(json) {
    if (this.mode === 'claude') {
      const res = await window.storage.set(STORE_KEY, json, true);
      if (!res) throw new Error('save returned null');
      return;
    }
    if (this.mode === 'firebase') {
      this._lastWritten = json;
      await this._ref.set(json);
      return;
    }
    /* local mode: state lives in memory only */
  },

  /* cb(json) fires when a remote change arrives */
  subscribe(cb) {
    if (this.mode === 'claude') {
      setInterval(async () => {
        if (document.hidden) return;
        try {
          const res = await window.storage.get(STORE_KEY, true);
          if (res && res.value) cb(res.value);
          markSynced();
        } catch (e) { /* keep last known state */ }
      }, POLL_MS);
    } else if (this.mode === 'firebase') {
      this._ref.on('value', (snap) => {
        const v = snap.val();
        if (typeof v === 'string' && v !== this._lastWritten) cb(v);
        markSynced();
      });
    }
  },

  statusLabel() {
    if (this.mode === 'claude') return 'LIVE \u00B7 SHARED BOARD';
    if (this.mode === 'firebase') return 'LIVE \u00B7 REALTIME SYNC';
    return 'LOCAL PREVIEW \u2014 NOT SYNCED';
  }
};

function normalizeState() {
  state.passHash ??= DEFAULT_PASS_HASH;
  state.updatedAt ??= Date.now();
  {
    const prevW = state.weights || {};
    state.weights = Object.fromEntries(STEP_DEFS.map((s) => {
      const v = Number(prevW[s.id]);
      return [s.id, Number.isFinite(v) && v >= 0 ? v : DEFAULT_WEIGHTS[s.id]];
    }));
  }
  state.condDur = state.condDur || {};
  Object.keys(COND_DAYS).forEach((bar) => { state.condDur[bar] = { ...COND_DAYS[bar], ...(state.condDur[bar] || {}) }; });
  state.series ??= []; state.orders ??= []; state.activities ??= []; state.log ??= [];
  state.logging = state.logging || {};
  state.logging.prismCounts = state.logging.prismCounts || { "1": 3, "2": 3, "3": 3 };
  state.logging.data = state.logging.data || {};
  if (!Array.isArray(state.phases) || !state.phases.length) {
    state.phases = ['RT1', 'RT2', 'RT3', 'RT4'].map((n) => ({ id: uid(), name: n }));
  }
  const byName = {};
  state.phases.forEach((p) => { byName[String(p.name).toUpperCase()] = p.id; });
  const migrate = (item) => {
    if (item.phaseId === undefined) {        /* migrate old task-string records */
      const t = String(item.task || '').trim();
      const key = t.toUpperCase();
      if (t && key !== 'GENERAL') {
        if (!byName[key]) {
          const p = { id: uid(), name: t };
          state.phases.push(p);
          byName[key] = p.id;
        }
        item.phaseId = byName[key];
      } else item.phaseId = '';
      delete item.task;
    }
    if (item.phaseId && !state.phases.some((p) => p.id === item.phaseId)) item.phaseId = '';
  };
  state.series.forEach((sr) => {
    migrate(sr);
    const prevSteps = sr.steps || {};
    sr.steps = Object.fromEntries(STEP_DEFS.map((s) => [s.id, prevSteps[s.id] || 'pending']));
    sr.stepDates = sr.stepDates || {};
    sr.stepStarted = sr.stepStarted || {};
    sr.sev = { ...blankSev(), ...(sr.sev || {}) };
  });
  state.orders.forEach((o) => { migrate(o); o.deliveryDate ??= ''; o.cost ??= 0; });
  state.activities.forEach(migrate);
  if (phaseFilter !== 'all' && phaseFilter !== '__none' && !state.phases.some((p) => p.id === phaseFilter)) {
    phaseFilter = 'all';
  }
}

/* ----------------------------- COMPUTE ----------------------------- */
const stepW = (id) => {
  const v = Number(state.weights[id]);
  return Number.isFinite(v) && v >= 0 ? v : 1;
};
const totalW = () => STEP_DEFS.reduce((a, s) => a + stepW(s.id), 0);

function seriesPct(sr) {
  const tw = totalW();
  if (!tw) return 0;
  const sum = STEP_DEFS.reduce((a, s) => a + stepW(s.id) * STATUS_VALUE[sr.steps[s.id] || 'pending'], 0);
  return Math.round((sum / tw) * 100);
}
function stagePct(stepId) {
  const list = fSeries();
  if (!list.length) return 0;
  const sum = list.reduce((a, sr) => a + STATUS_VALUE[sr.steps[stepId] || 'pending'], 0);
  return Math.round((sum / list.length) * 100);
}
function overallPct() {
  const list = fSeries();
  if (!list.length) return 0;
  return Math.round(list.reduce((a, sr) => a + seriesPct(sr), 0) / list.length);
}
function sevChips(sr) {

function orderEta(o) {
  if (o.status === 'delivered') return { cls: 'in', txt: 'DELIVERED' };
  const exp = parseDay(o.expected);
  if (!exp) return { cls: '', txt: 'NO ETA' };
  const days = Math.ceil((exp - Date.now()) / DAY);

  if (days <= 14) return { cls: 'soon', txt: 'T\u2212' + days + 'D' };
  return { cls: '', txt: 'T\u2212' + days + 'D' };
}

/* Count-up animation for KPI numbers */
function tweenCounts() {
  if (reducedMotion()) return;
  $$('.kpi b').forEach((el) => {
    const n = parseInt(el.textContent, 10);
    if (!Number.isFinite(n) || n === 0) return;
    const t0 = performance.now();
    const dur = 650;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = String(Math.round(n * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function animateHeroTotal() {
  const host = document.querySelector('.hero-total');
  if (!host) return;
  const target = parseFloat(host.dataset.total) || 0;
  const intEl = host.querySelector('.ht-int');
  const decEl = host.querySelector('.ht-dec');
  const paint = (v) => {
    const w = Math.floor(v);
    intEl.textContent = w.toLocaleString('en-US');
    if (decEl) decEl.textContent = '.' + String(Math.round((v - w) * 100)).padStart(2, '0');
  };
  if (reducedMotion() || target <= 0) { paint(target); return; }
  const t0 = performance.now(), dur = 850;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    paint(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(tick); else paint(target);
  };
  requestAnimationFrame(tick);
}

  let lens = '';
  if (lensStep) {
    const def = STEP_DEFS.find((s) => s.id === lensStep);
    const cols = STATUS_ORDER.slice().reverse().map((st) => {
      const items = fSeries().filter((sr) => (sr.steps[lensStep] || 'pending') === st);

      <div class="lens-cols">${cols}</div></div>`;
  }
  return `<div class="pipeline">${stages}</div>${lens}`;
}

function currentStage(sr) {
  const active = STEP_DEFS.find((st) => (sr.steps || {})[st.id] === 'active');
  if (active) return active.name + ' in progress';
  const pending = STEP_DEFS.find((st) => (sr.steps || {})[st.id] === 'pending');
  if (!pending) return 'Complete';
  const anyDone = STEP_DEFS.some((st) => (sr.steps || {})[st.id] === 'done');
  return anyDone ? 'Next: ' + pending.name : 'Not started';
}
function renderTimeline() {
  const list = fSeries();
  const dated = list.filter((sr) => sr.start && sr.end);
  if (!dated.length) {
    return `<div class="panel corners"><span class="c"></span>
      <div class="panel-title">Series Timeline</div>
      <div class="empty">No series in this phase have start / expected-end dates yet.<br>Edit a series (pencil icon in the Series Matrix) to set its dates and it appears here as a Gantt bar.</div></div>`;
  }
  const PAD = 15 * DAY;
  const min = Math.min(...dated.map((sr) => +parseDay(sr.start))) - PAD;
  const max = Math.max(...dated.map((sr) => +parseDay(sr.end))) + PAD;
  const range = Math.max(max - min, DAY);
  const today = Date.now();
  const todayPct = Math.min(100, Math.max(0, ((today - min) / range) * 100));
  const fmt = (t) => new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric', year: '2-digit' });

  const rows = list.map((sr, i) => {
    const d = Math.min(i * 50, 450) + 'ms';
    let track;
    if (sr.start && sr.end) {
      const s = +parseDay(sr.start), e = +parseDay(sr.end);
      const left = Math.max(0, ((s - min) / range) * 100);
      const width = Math.max(0.5, ((e - s) / range) * 100);
      const p = seriesPct(sr);
      const overdue = today > e && p < 100;
      const marks = STEP_DEFS.filter((st) => (sr.stepDates || {})[st.id]).map((st) => {
        const x = ((+parseDay(sr.stepDates[st.id]) - min) / range) * 100;
        return (x < 0 || x > 100) ? '' : `<span class="gmark" style="left:${x}%" title="${st.name} done ${sr.stepDates[st.id]}"></span>`;
      }).join('');
      track = `<div class="g-track">${marks}
        <div class="g-bar ${overdue ? 'overdue' : ''}" title="${esc(currentStage(sr))}" style="left:${left}%; width:${width}%; --d:${d}">
          <div class="g-fill" style="width:${p}%"></div><span class="g-pct">${p}%</span>
        </div></div>`;
    } else {
      track = `<div class="g-track"><span class="g-nodates" style="position:absolute; left:8px; top:4px;">SET START / END DATES</span></div>`;
    }
    return `<div class="g-row" style="--d:${d}">
      <div class="g-label"><div class="series-id">${srLabel(sr)}</div>
        <div class="series-tags">${sevChips(sr)}</div></div>
      ${track}</div>`;
  }).join('');

  return `<div class="panel corners"><span class="c"></span>
    <div class="panel-title">Series Timeline \u2014 Gantt</div>
    <div class="table-scroll"><div class="g-wrap">
      <div class="g-axis"><span>${fmt(min)}</span><span class="t">TODAY \u00B7 ${fmt(today)}</span><span>${fmt(max)}</span></div>
      <div class="g-rows">${rows}<div class="today-line" style="left:calc(var(--glabel) + 14px + (100% - var(--glabel) - 14px) * ${(todayPct / 100).toFixed(4)})"></div></div>
    </div></div></div>`;
}

const SEV_COLOR = { M: 'var(--green)', Mo: 'var(--amber)', S: 'var(--red)' };
function govSev(s) {
  const sevs = ['csr', 'asr'].map((k) => (s.sev || {})[k] || 'N').filter((x) => x !== 'N');
  if (!sevs.length) return null;
  const rank = { M: 1, Mo: 2, S: 3 };
  return sevs.reduce((a, b) => (rank[b] || 0) > (rank[a] || 0) ? b : a, sevs[0]);
}
function actualCond(bar, sevCode, list) {
  const matches = list.filter((s) => s.bar === bar && govSev(s) === sevCode && (s.stepStarted || {}).condition && (s.stepDates || {}).condition);
  if (!matches.length) return null;
  const durs = matches.map((s) => Math.max(0, Math.round((parseDay(s.stepDates.condition) - parseDay(s.stepStarted.condition)) / DAY)));
  return { days: Math.round(durs.reduce((a, b) => a + b, 0) / durs.length), n: matches.length };
}
function renderCondDurations() {

  const sevs = [['M', 'Mild'], ['Mo', 'Moderate'], ['S', 'Severe']];

      <span class="cd-sev-dot"></span>${label}</button>`).join('');
  const C = 2 * Math.PI * 38, MAXSCALE = 220;
  const rings = RT1_BARS.map((bar) => {
    const exp = ((state.condDur || COND_DAYS)[bar] || {})[condSevSel] || 0;
    const act = actualCond(bar, condSevSel, list);
    const off = C * (1 - (act ? Math.min(1, act.days / MAXSCALE) : 0));
    return `<div class="cd-ring ${act ? '' : 'nodata'}" style="--sc:${SEV_COLOR[condSevSel]}">
      <div class="cd-gauge">
        <svg viewBox="0 0 90 90"><circle class="cdr-track" cx="45" cy="45" r="38"/><circle class="cdr-arc" cx="45" cy="45" r="38" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg>
        <div class="cd-center">${act ? `<b>${act.days}</b><small>days</small>` : `<span class="cd-nodata">NO DATA</span>`}</div>
      </div>
      <div class="cd-bar-lbl">${bar}</div>
      <div class="cd-exp">expected ${exp} d${act && act.n > 1 ? ` \u00B7 ${act.n} spec` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="panel corners"><span class="c"></span>
    <div class="panel-title">Conditioning Durations${editMode ? ' <span class="right"><button class="btn-sm" data-action="cond-edit-modal">\u270E Edit expected</button></span>' : ''}</div>
    <div class="cd-wrap">
      <div class="cd-sevlist">${sevList}</div>
      <div class="cd-detail">${rings}</div>
    </div>
  </div>`;
}

async function saveCondDurations() {
  state.condDur = state.condDur || {};
  RT1_BARS.forEach((bar) => {

    ['M', 'Mo', 'S'].forEach((sev) => {

const EXP_TARGETS = [{ v: 2, label: 'Mild 2\u00D710\u207B\u00B3' }, { v: 3, label: 'Mod 3' }, { v: 4, label: 'Sev 4' }];

function logKeyFor(cat) {
  return cat === 'beam'
    ? `b|${logSev}|${logBar}|${logCover}|${logBeam}`
    : `p|${logBatch}|${logPrism}`;
}
function logRec(key, create) {
  state.logging = state.logging || { prismCounts: {}, data: {} };
  state.logging.data = state.logging.data || {};
  if (!state.logging.data[key] && create) state.logging.data[key] = { readings: [], massLoss: null };
  return state.logging.data[key] || null;
}
const CHART_COLORS = ['#3FE0FF', '#4DF59B', '#FFB454', '#FF5C7A', '#B18CFF', '#7EE0C0', '#FF9E6D', '#8AB4FF'];
function readingsToDayPts(readings) {
  const rd = (readings || []).filter((r) => r.exp != null && r.exp !== '').slice().sort((a, b) => String(a.d).localeCompare(String(b.d)));
  if (!rd.length) return [];
  const d0 = +parseDay(rd[0].d);
  return rd.map((r) => ({ day: Math.round((+parseDay(r.d) - d0) / DAY), v: Number(r.exp) }));
}
function keyLabel(k) {
  const rec = (state.logging && state.logging.data) ? state.logging.data[k] : null;
  if (rec && rec.label) return rec.label;
  const p = String(k).split('|');
  if (p[0] === 'b') return `${SEV_LABEL[p[1]] || p[1]} \u00B7 ${p[2]} \u00B7 ${p[3]} \u00B7 Beam ${p[4]}`;
  if (p[0] === 'p') return `Batch ${p[1]} \u00B7 Prism ${p[2]}`;
  return k;
}
function svgDaysChart(seriesList, opts) {
  opts = opts || {};
  const withData = (seriesList || []).filter((s) => s.pts && s.pts.length);
  if (!withData.length) return '<div class="chart-empty">No data logged yet.</div>';
  const W = 580, H = 235, L = 46, R = 16, T = 14, B = 40;
  const targets = opts.targets || [];
  let maxDay = 0, maxV = 1, minV = 0;
  withData.forEach((s) => s.pts.forEach((p) => { if (p.day > maxDay) maxDay = p.day; if (p.v > maxV) maxV = p.v; if (p.v < minV) minV = p.v; }));
  targets.forEach((t) => { if (t.v > maxV) maxV = t.v; });
  if (maxDay === 0) maxDay = 1;
  maxV += (maxV - minV) * 0.1;
  const sx = (day) => L + (day / maxDay) * (W - L - R);
  const sy = (v) => H - B - (v - minV) / (maxV - minV) * (H - T - B);
  const yt = [minV, (minV + maxV) / 2, maxV].map((v) => `<line x1="${L}" y1="${sy(v).toFixed(1)}" x2="${W - R}" y2="${sy(v).toFixed(1)}" class="grid"/><text x="${L - 5}" y="${(sy(v) + 3).toFixed(1)}" text-anchor="end" class="axlbl">${+v.toFixed(2)}</text>`).join('');
  const tg = targets.map((t) => `<line x1="${L}" y1="${sy(t.v).toFixed(1)}" x2="${W - R}" y2="${sy(t.v).toFixed(1)}" class="tgt"/><text x="${W - R}" y="${(sy(t.v) - 4).toFixed(1)}" text-anchor="end" class="tgtlbl">${esc(t.label)}</text>`).join('');
  const lines = withData.map((s, i) => {
    const color = s.color || CHART_COLORS[i % CHART_COLORS.length];
    const op = s.muted ? 0.12 : 1;
    const path = s.pts.map((p, j) => (j ? 'L' : 'M') + sx(p.day).toFixed(1) + ' ' + sy(p.v).toFixed(1)).join(' ');
    const dots = s.pts.map((p) => `<circle cx="${sx(p.day).toFixed(1)}" cy="${sy(p.v).toFixed(1)}" r="2.6" style="fill:${color};pointer-events:none;opacity:${op}"/>`).join('');
    const vis = `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" style="filter:drop-shadow(0 0 3px ${color});pointer-events:none;opacity:${op}"/>`;
    const hit = s.key ? `<path d="${path}" fill="none" stroke="transparent" stroke-width="16" style="cursor:pointer" data-cmpline="1" data-action="log-cmp-mute" data-key="${esc(s.key)}"><title>Left-click to hide \u00B7 right-click for options</title></path>` : '';
    return vis + dots + hit;
  }).join('');
  const xlabs = [0, Math.round(maxDay / 2), maxDay].map((day) => `<text x="${sx(day).toFixed(1)}" y="${H - 22}" text-anchor="middle" class="axlbl">${day}</text>`).join('');
  const xtitle = `<text x="${((L + (W - R)) / 2).toFixed(0)}" y="${H - 6}" text-anchor="middle" class="axlbl" style="letter-spacing:2px">DAYS</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${yt}${tg}${lines}${xlabs}${xtitle}</svg>`;
}

function renderCompareMode() {
  const data = (state.logging && state.logging.data) || {};

  const chartInner = seriesList.length ? svgDaysChart(seriesList, { targets: EXP_TARGETS }) : `<div class="cmp-drop-hint">Drag specimens here to plot them.</div>`;

function renderTanks() {
  const list = fSeries();
  const tanks = [{ n: 'Tank 1', cover: '1.5"' }, { n: 'Tank 2', cover: '2.5"' }];
  const sevShort = (s) => ['csr', 'asr', 'ftc'].filter((k) => (s.sev || {})[k] !== 'N').map((k) => k.toUpperCase() + ' ' + SEV_LABEL[s.sev[k]]).join(' \u00B7 ') || 'Control';
  const panels = tanks.map((t) => {
    const series = list.filter((s) => s.cover === t.cover);
    const active = series.filter((s) => (s.steps.condition || 'pending') === 'active');
    const queued = series.filter((s) => (s.steps.condition || 'pending') === 'pending' && (s.steps.cast || 'pending') === 'done');
    const done = series.filter((s) => (s.steps.condition || 'pending') === 'done');
    const used = active.length;
    const over = used > TANK_CAP;
    const pct = Math.min(100, Math.round(used / TANK_CAP * 100));
    let slots = '';
    const n = Math.max(TANK_CAP, used);
    for (let i = 0; i < n; i++) {
      const s = active[i];
      slots += s
        ? `<div class="slot filled ${i >= TANK_CAP ? 'over' : ''}"><div class="slot-id">${srLabel(s)}</div><div class="slot-sev">${esc(sevShort(s))}</div></div>`
        : `<div class="slot"><span>OPEN</span></div>`;
    }
    return `<div class="panel corners"><span class="c"></span>
      <div class="panel-title">${t.n} \u00B7 ${t.cover} Cover <span class="right ${over ? 'over' : ''}">${used} / ${TANK_CAP} slots${over ? ' \u00B7 OVER CAPACITY' : ''}</span></div>
      <div class="tbar"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="slots">${slots}</div>
      <div class="tmeta"><span>Queued: <b>${queued.length}</b></span><span>Conditioned: <b>${done.length}</b></span></div>
    </div>`;
  }).join('');
  return `${panels}${renderCondDurations()}`;
}

    ${cards}</div>`;
}

function fmtMoney(n) { return (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }); }
function parseQty(s) {
  const str = String(s || '').trim();
  const m = str.match(/^([\d.,]+)\s*(.*)$/);
  if (!m) return { num: null, unit: str };
  const num = parseFloat(m[1].replace(/,/g, ''));
  return { num: Number.isFinite(num) ? num : null, unit: (m[2] || '').trim() };
}
function csvStamp() { return new Date().toISOString().slice(0, 10); }
function downloadBlob(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 150);
}
function downloadCSV(filename, rows) {
  const cell = (v) => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = rows.map((r) => r.map(cell).join(',')).join('\r\n');
  downloadBlob(filename, '\ufeff' + csv, 'text/csv');
  toast('CSV EXPORTED');
}
function exportBoard() {
  try { downloadBlob('fsel_board_' + csvStamp() + '.json', JSON.stringify(state, null, 2), 'application/json'); toast('BOARD EXPORTED'); }
  catch (e) { toast('EXPORT FAILED', 'bad'); }
}
function importBoard() {
  if (!requireEdit()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) { toast('INVALID JSON FILE', 'bad'); return; }
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.series)) { toast('NOT A VALID BOARD FILE', 'bad'); return; }
      confirmImport(parsed);
    };
    reader.onerror = () => toast('COULD NOT READ FILE', 'bad');
    reader.readAsText(file);
  };
  inp.click();
}
function confirmImport(parsed) {
  pendingImport = parsed;
  const n = (parsed.series || []).length, o = (parsed.orders || []).length, a = (parsed.activities || []).length;
  openModal(`<h2>Restore Board</h2>
    <div class="note">This replaces the entire board${Store.mode !== 'local' ? ' for all viewers' : ''} with the imported file: <b style="color:var(--text)">${n} series, ${o} orders, ${a} activities</b>. This cannot be undone \u2014 export a backup first if you\u2019re unsure.</div>
    <div class="modal-actions">
      <button class="btn-ghost" data-action="close-modal">Cancel</button>
      <button class="btn-danger" data-action="do-import">Replace Board</button>
    </div>`);
}
async function doImport() {
  if (!pendingImport) { closeModal(); return; }
  state = pendingImport; pendingImport = null;
  normalizeState();
  state.updatedAt = Date.now();
  pendingRemote = null;   /* imported+saved board is authoritative */
  closeModal();
  render();
  await saveState();
  toast('BOARD RESTORED');
}
function exportOrdersCSV() {
  const rows = [['Item', 'Vendor', 'Quantity', 'Cost (USD)', 'Phase', 'Status', 'Order Date', 'Expected Delivery', 'Delivery Date', 'Notes']];
  fOrders().forEach((o) => rows.push([
    o.item, o.vendor, o.qty, (Number(o.cost) || 0).toFixed(2),
    phaseName(o.phaseId), ORDER_LABEL[o.status] || o.status,
    o.ordered, o.expected, o.deliveryDate || '', o.notes
  ]));
  if (rows.length === 1) { toast('NO ORDERS TO EXPORT', 'warn'); return; }
  downloadCSV('orders_' + csvStamp() + '.csv', rows);
}
function exportExpensesCSV() {
  const items = {};
  fOrders().forEach((o) => {
    const name = (o.item || '').trim(); if (!name) return;
    const key = name.toLowerCase();
    const it = items[key] || (items[key] = { name, cost: 0, units: {} });
    it.cost += Number(o.cost) || 0;
    const { num, unit } = parseQty(o.qty); if (num != null) { const u = unit || 'ea'; it.units[u] = (it.units[u] || 0) + num; }
  });
  const list = Object.values(items).sort((a, b) => b.cost - a.cost);
  if (!list.length) { toast('NO EXPENSES TO EXPORT', 'warn'); return; }
  const rows = [['Item', 'Quantity', 'Total Cost (USD)']];
  list.forEach((it) => {
    const qty = Object.entries(it.units).map(([u, n]) => `${+n.toFixed(2)} ${u}`).join(' + ');
    rows.push([it.name, qty, it.cost.toFixed(2)]);
  });
  downloadCSV('expenses_' + csvStamp() + '.csv', rows);
}

function renderExpenses() {
  const ords = fOrders();
  const total = ords.reduce((a, o) => a + (Number(o.cost) || 0), 0);

  /* consolidate repeated orders of the same item */
  const items = {};
  ords.forEach((o) => {
    const name = (o.item || '').trim();
    if (!name) return;
    const key = name.toLowerCase();
    const it = items[key] || (items[key] = { key, name, cost: 0, units: {}, orders: [] });
    it.cost += Number(o.cost) || 0;
    it.orders.push(o);
    const { num, unit } = parseQty(o.qty);
    if (num != null) { const u = unit || 'ea'; it.units[u] = (it.units[u] || 0) + num; }
  });
  const itemRows = Object.values(items).sort((a, b) => b.cost - a.cost);
  const qtyStr = (units) => {
    const e = Object.entries(units);
    return e.length ? e.map(([u, n]) => `${+n.toFixed(2)} ${u}`).join(' \u00B7 ') : '\u2014';
  };
  const bodyRows = itemRows.map((it) => `<tr class="xrow" data-action="expense-item" data-key="${esc(it.key)}">
      <td><span class="xcaret">\u25B8</span>${esc(it.name)}</td>
      <td class="num">${esc(qtyStr(it.units))}</td>
      <td class="num cost">${fmtMoney(it.cost)}</td></tr>`).join('');

  const table = itemRows.length ? `
    <table class="xtable">
      <thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Total Cost</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>` : `<div class="empty">No orders in this phase yet.<br>Add a Cost to an order (Orders tab) to see it here.</div>`;

  const whole = Math.floor(total);
  const cents = String(Math.round((total - whole) * 100)).padStart(2, '0');

  return `
    <div class="hero-total corners" data-total="${total}"><span class="c"></span><i class="ht-sheen"></i>
      <div class="ht-label">Total Spent</div>
      <div class="ht-value"><span class="ht-cur">$</span><span class="ht-int">${whole.toLocaleString('en-US')}</span><span class="ht-dec">.${cents}</span></div>
    </div>
    <div class="panel corners" style="--d:120ms"><span class="c"></span>
      <div class="xtoolbar"><button class="btn-sm" data-action="export-expenses">\u2193 Export CSV</button></div>
      <div class="table-scroll">${table}</div>
    </div>`;
}

  return `<div class="panel corners"><span class="c"></span>

/* ----------------------------- ACTIONS ----------------------------- */
function requireEdit() {
  if (!editMode) { toast('BOARD LOCKED \u2014 UNLOCK EDIT MODE FIRST', 'warn'); return false; }
  if (Store.mode === 'local') toast('LOCAL PREVIEW \u2014 CHANGES WILL NOT BE SAVED', 'warn');
  return true;
}
const nextOf = (arr, v) => arr[(arr.indexOf(v) + 1) % arr.length];

async function cycleStep(seriesId, stepId) {
  if (!requireEdit()) return;
  const sr = state.series.find((s) => s.id === seriesId);
  if (!sr) return;
  const ns = nextOf(STATUS_ORDER, sr.steps[stepId] || 'pending');
  sr.steps[stepId] = ns;
  sr.stepDates = sr.stepDates || {};
  sr.stepStarted = sr.stepStarted || {};
  if (ns === 'active') { if (!sr.stepStarted[stepId]) sr.stepStarted[stepId] = todayISO(); delete sr.stepDates[stepId]; }
  else if (ns === 'done') { if (!sr.stepStarted[stepId]) sr.stepStarted[stepId] = todayISO(); sr.stepDates[stepId] = todayISO(); }
  else { delete sr.stepStarted[stepId]; delete sr.stepDates[stepId]; }
  pushLog(`${srLabelPlain(sr)} \u2014 ${STEP_DEFS.find((s) => s.id === stepId).name} \u2192 ${STATUS_LABEL[ns]}`);
  render();
  await saveState();
}
async function cycleActivity(id) {
  if (!requireEdit()) return;
  const a = state.activities.find((x) => x.id === id);
  if (!a) return;
  a.status = nextOf(STATUS_ORDER, a.status);
  pushLog(`Activity "${a.title}" \u2192 ${STATUS_LABEL[a.status]}`);
  render();
  await saveState();
}
async function cycleOrder(id) {
  if (!requireEdit()) return;
  const o = state.orders.find((x) => x.id === id);
  if (!o) return;
  o.status = nextOf(ORDER_ORDER, o.status);
  pushLog(`Order "${o.item}" \u2192 ${ORDER_LABEL[o.status]}`);
  render();
  await saveState();
}

}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOpen) closeModal();
  if (e.key === 'Escape') hideCtxMenu();
  if (e.key === 'Enter' && modalOpen && e.target && e.target.id === 'passInput') tryUnlock();
  if (e.key === 'Tab' && modalOpen) {
    const box = $('#modalBox');
    const foci = [...box.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter((el) => !el.disabled && el.offsetParent !== null);
    if (foci.length) {
      const first = foci[0], last = foci[foci.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
});

});

async function tryUnlock() {
  const input = $('#passInput');
  const err = $('#passErr');
  try {
    const h = await sha256Hex(input ? input.value : '');
    if (h === state.passHash) {
      editMode = true;
      closeModal();
      render();
      toast('EDIT MODE ENABLED');
    } else {
      err.textContent = 'INCORRECT PASSCODE';
      err.style.display = 'block';
    }
  } catch (e) {
    err.textContent = 'UNLOCK ERROR: ' + (e && e.message ? e.message : 'HASHING FAILED');
    err.style.display = 'block';
  }
}

  const removedIds = [];

  $$('#modalBox .ph-row').forEach((row) => {
    const id = row.dataset.phid;
    if (row.dataset.deleted === '1') { removedIds.push(id); return; }
    const old = state.phases.find((p) => p.id === id);
    const name = row.querySelector('input').value.trim().slice(0, 30);

    [...state.series, ...state.orders, ...state.activities].forEach((item) => {
      if (removedIds.includes(item.phaseId)) item.phaseId = '';
    });

  const sevOpts = ['Control', 'Mild', 'Moderate', 'Severe'].map((s) => `<option value="${s}">${s}</option>`).join('');
  openModal(`<h2>Generate RT1 Matrix</h2>
    <div class="note">Builds the RT1 specimen set for one severity level: 3 bar sizes (#5, #7, #11) \u00D7 2 covers (1.5", 2.5"). Control = 1 beam each; Mild / Moderate / Severe = 2 beams each, with CSR and ASR paired. Start = today; Expected End is projected from the step durations plus the expected conditioning days for each bar/severity. Every date stays editable, and existing series are skipped.</div>

      <div class="field"><label>Phase</label><select id="genPhase">${phaseOptions(defPhase, false)}</select></div>
      <div class="field"><label>Severity</label><select id="genSev">${sevOpts}</select></div>

    </div>
    <div class="modal-actions">
      <button class="btn-ghost" data-action="close-modal">Cancel</button>
      <button class="btn-go" data-action="do-generate">Generate</button>
    </div>`);
}
async function doGenerateMatrix() {
  const phaseId = $('#genPhase').value;
  const sevKey = $('#genSev').value;
  const batch = Math.max(0, parseInt($('#genBatch').value, 10) || 0);
  const cfg = SEV_GEN[sevKey];
  if (!cfg) { closeModal(); return; }
  let created = 0, skipped = 0;
  RT1_BARS.forEach((bar) => {
    RT1_COVERS.forEach((cover) => {
      const exists = state.series.some((s) =>
        s.phaseId === phaseId && s.bar === bar && s.cover === cover && Number(s.batch) === batch &&
        (s.sev || {}).csr === cfg.csr && (s.sev || {}).asr === cfg.asr && (s.sev || {}).ftc === cfg.ftc);
      if (exists) { skipped++; return; }
      const start = todayISO();
      const s = {
        id: uid(), phaseId, batch, bar, cover,
        sev: { csr: cfg.csr, asr: cfg.asr, ftc: cfg.ftc },
        beams: cfg.beams, start, end: '', steps: blankSteps(), stepDates: {}, stepStarted: {}
      };
      s.end = projectEnd(start, s);
      state.series.push(s);
      created++;
    });
  });
  pushLog(`Generated RT1 ${sevKey} (batch ${batch}): +${created} series${skipped ? ', ' + skipped + ' skipped' : ''}.`);
  closeModal();
  render();
  await saveState();
  toast(`GENERATED ${created} SERIES${skipped ? ' \u00B7 ' + skipped + ' EXISTED' : ''}`);
}

      <select id="fStatus">${STATUS_ORDER.map((s) =>
        `<option value="${s}" ${a && a.status === s ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
    <div class="field"><label>Notes</label><textarea id="fNotes" maxlength="400">${a ? esc(a.notes) : ''}</textarea></div>
    <div class="err" id="fErr">ACTIVITY NAME IS REQUIRED</div>
    <div class="modal-actions">
      <button class="btn-ghost" data-action="close-modal">Cancel</button>
      <button class="btn-go" data-action="save-activity" data-id="${id || ''}">${a ? 'Save Changes' : 'Add Activity'}</button>
    </div>`);
}
async function saveActivity(id) {
  const title = $('#fTitle').value.trim();
  if (!title) { $('#fErr').style.display = 'block'; return; }
  const data = {
    title: title.slice(0, 120), phaseId: $('#fAPhase').value,
    cat: $('#fCat').value.trim(), owner: $('#fOwner').value.trim(),
    due: $('#fDue').value, status: $('#fStatus').value, notes: $('#fNotes').value.trim()
  };
  if (id) {
    const a = state.activities.find((x) => x.id === id);
    if (!a) { closeModal(); return; }
    Object.assign(a, data);
    pushLog(`Activity updated: "${title}"`);
  } else {
    state.activities.unshift({ id: uid(), ...data });
    pushLog(`Activity added: "${title}"`);
  }
  closeModal();
  render();
  await saveState();
  toast(id ? 'ACTIVITY UPDATED' : 'ACTIVITY ADDED');
}

/* --- delete confirm --- */
function findItem(kind, id) {
  if (kind === 'series') return state.series.find((x) => x.id === id);
  if (kind === 'order') return state.orders.find((x) => x.id === id);
  return state.activities.find((x) => x.id === id);
}
function confirmDelete(kind, id) {
  if (!requireEdit()) return;
  const item = findItem(kind, id);
  if (!item) { toast('ITEM NO LONGER ON BOARD', 'warn'); render(); return; }
  const label = kind === 'series' ? srLabelPlain(item) : (item.title || item.item);
  openModal(`<h2>Confirm Delete</h2>
    <div class="note">This removes <b style="color:var(--text)">${esc(label)}</b> from the shared board
    for all viewers. This cannot be undone.</div>
    <div class="modal-actions">
      <button class="btn-ghost" data-action="close-modal">Cancel</button>
      <button class="btn-danger" data-action="do-delete" data-kind="${kind}" data-id="${id}">Delete</button>
    </div>`);
}
async function doDelete(kind, id) {
  const item = findItem(kind, id);
  if (!item) { closeModal(); render(); return; }
  if (kind === 'series') {
    state.series = state.series.filter((x) => x.id !== id);
    pushLog('Series removed: ' + srLabelPlain(item));
  } else if (kind === 'order') {
    state.orders = state.orders.filter((x) => x.id !== id);
    pushLog(`Order removed: "${item.item}"`);
  } else {
    state.activities = state.activities.filter((x) => x.id !== id);
    pushLog(`Activity removed: "${item.title}"`);
  }
  closeModal();
  render();
  await saveState();
  toast('REMOVED FROM BOARD', 'warn');
}

/* ----------------------------- DELEGATION ----------------------------- */
/* Single delegated listener — no inline onclick attributes anywhere. */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const d = el.dataset;
  const actions = {
    'tab':            () => { currentTab = d.tab; render(); },
    'phase':          () => { phaseFilter = d.phase; render(); },
    'lock-menu':      () => openLockMenu(),
    'try-unlock':     () => tryUnlock(),
    'lock-board':     () => lockBoard(),
    'export-board':   () => exportBoard(),
    'import-board':   () => importBoard(),
    'do-import':      () => doImport(),
    'passcode-change':() => openPasscodeChange(),
    'save-passcode':  () => savePasscode(),
    'close-modal':    () => closeModal(),
    'lens':           () => { lensStep = (lensStep === d.step ? null : d.step); render(); },
    'expense-item':   () => openExpenseDetail(d.key),
    'export-orders':  () => exportOrdersCSV(),
    'export-expenses':() => exportExpensesCSV(),
    'generate-modal': () => openGenerateModal(),
    'do-generate':    () => doGenerateMatrix(),
    'mtx-bar':        () => { mtxBar = d.val; render(); },
    'mtx-cover':      () => { mtxCover = d.val; render(); },
    'mtx-sev':        () => { mtxSev = d.val; render(); },
    'cond-sev-sel':   () => { condSevSel = d.val; render(); },
    'log-cat':        () => { logCat = d.val; render(); },
    'log-sev':        () => { logSev = d.val; render(); },
    'log-bar':        () => { logBar = d.val; render(); },
    'log-cover':      () => { logCover = d.val; render(); },
    'log-beam':       () => { logBeam = Number(d.val); render(); },
    'log-batch':      () => { logBatch = Number(d.val); logPrism = 1; render(); },
    'log-prism':      () => { logPrism = Number(d.val); render(); },
    'log-add-prism':  () => logAddPrism(),
    'log-add-reading':() => logAddReading(d.key),
    'log-save-label': () => logSaveLabel(d.key),
    'log-save-mass':  () => logSaveMass(d.key),
    'log-del-reading':() => logDelReading(d.key, d.idx),
    'cmp-cat':        () => { cmpCat = d.val; render(); },
    'cmpf-sev':       () => { cmpSev = d.val; render(); },
    'cmpf-bar':       () => { cmpBar = d.val; render(); },
    'cmpf-cover':     () => { cmpCover = d.val; render(); },
    'cmpf-batch':     () => { cmpBatch = d.val; render(); },
    'log-cmp-mute':   () => { const i = logMuted.indexOf(d.key); if (i >= 0) logMuted.splice(i, 1); else logMuted.push(d.key); render(); },
    'ctx-remove':     () => { hideCtxMenu(); const i = logCompare.indexOf(d.key); if (i >= 0) { logCompare.splice(i, 1); const j = logMuted.indexOf(d.key); if (j >= 0) logMuted.splice(j, 1); render(); } },
    'ctx-showlog':    () => { hideCtxMenu(); showDataLog(d.key); },
    'log-cmp-clear':  () => { logCompare = []; logMuted = []; render(); },
    'cond-edit-modal':() => openCondModal(),
    'save-cond-durations': () => saveCondDurations(),
    'cycle-step':     () => cycleStep(d.series, d.step),
    'cycle-activity': () => cycleActivity(d.id),
    'cycle-order':    () => cycleOrder(d.id),
    'filter':         () => { activityFilter = d.filter; render(); },
    'series-modal':   () => openSeriesModal(d.id || null),
    'save-series':    () => saveSeries(d.id || null),
    'order-modal':    () => openOrderModal(d.id || null),
    'save-order':     () => saveOrder(d.id || null),
    'activity-modal': () => openActivityModal(d.id || null),
    'save-activity':  () => saveActivity(d.id || null),
    'manage-weights': () => openWeightsModal(),
    'save-weights':   () => saveWeights(),
    'phases-modal':   () => openPhasesModal(),
    'save-phases':    () => savePhases(),
    'confirm-delete': () => confirmDelete(d.kind, d.id),
    'do-delete':      () => doDelete(d.kind, d.id),
    'ph-del': () => {
      const row = el.closest('.ph-row');
      row.dataset.deleted = row.dataset.deleted === '1' ? '' : '1';
      row.classList.toggle('rowdel', row.dataset.deleted === '1');
    }
  };
  const fn = actions[d.action];
  if (fn) fn();
});
/* Keyboard activation for the pipeline stages (role=button) */
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.action === 'lens') {
    e.preventDefault();
    lensStep = (lensStep === e.target.dataset.step ? null : e.target.dataset.step);
    render();
  }
});

/* ----------------------------- INIT ----------------------------- */
(async function init() {
  $('#view').innerHTML = '<div class="empty">CONNECTING TO SHARED BOARD&hellip;</div>';
  await Store.init();
  const json = await Store.load();
  if (json) {
    try { state = JSON.parse(json); } catch (e) { state = defaultState(); }
    normalizeState();
    try { if (Store.mode !== 'local' && JSON.stringify(state) !== json) await Store.save(JSON.stringify(state)); } catch (e) { /* best effort */ }
  } else {
    state = defaultState();
    if (Store.mode !== 'local') { try { await Store.save(JSON.stringify(state)); } catch (e) { /* first save */ } }
  }
  markSynced();
  if (Store.mode === 'local') {
    toast('LOCAL PREVIEW \u2014 NO BACKEND CONFIGURED, CHANGES ARE NOT SAVED', 'warn');
  }
  Store.subscribe((j) => applyRemote(j));
  render();
})();
</script>
